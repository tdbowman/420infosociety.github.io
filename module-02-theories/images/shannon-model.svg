<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">Shannon's Model of Communication (1948)</text>

  <!-- meaning callout (dashed) -->
  <rect x="235" y="54" width="430" height="52" rx="8" fill="#fafafa" stroke="#00423b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Meaning is deliberately OUTSIDE the model</text>
  <text x="450" y="95" text-anchor="middle" font-size="12" fill="#455a64">"Semantic aspects … are irrelevant to the engineering problem."</text>
  <!-- callout pointer down to channel -->
  <line x1="450" y1="106" x2="450" y2="150" stroke="#00423b" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/>
    </marker>
  </defs>

  <!-- main flow boxes, y=160..240 -->
  <!-- Information Source -->
  <rect x="30" y="160" width="140" height="80" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="100" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Information</text>
  <text x="100" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Source</text>

  <!-- Encoder -->
  <rect x="215" y="160" width="140" height="80" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="285" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Encoder</text>
  <text x="285" y="212" text-anchor="middle" font-size="12" fill="#455a64">(transmitter)</text>

  <!-- Channel -->
  <rect x="400" y="160" width="140" height="80" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="470" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Channel</text>
  <text x="470" y="212" text-anchor="middle" font-size="12" fill="#455a64">(signal)</text>

  <!-- Decoder -->
  <rect x="585" y="160" width="140" height="80" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="655" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Decoder</text>
  <text x="655" y="212" text-anchor="middle" font-size="12" fill="#455a64">(receiver)</text>

  <!-- Destination -->
  <rect x="770" y="160" width="110" height="80" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="825" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Destination</text>

  <!-- flow arrows -->
  <line x1="170" y1="200" x2="209" y2="200" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="355" y1="200" x2="394" y2="200" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="200" x2="579" y2="200" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="725" y1="200" x2="764" y2="200" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- labels under arrows -->
  <text x="190" y="188" text-anchor="middle" font-size="11" fill="#455a64">message</text>
  <text x="375" y="188" text-anchor="middle" font-size="11" fill="#455a64">signal</text>
  <text x="560" y="188" text-anchor="middle" font-size="11" fill="#455a64">signal + noise</text>
  <text x="745" y="188" text-anchor="middle" font-size="11" fill="#455a64">message</text>

  <!-- noise source -->
  <rect x="400" y="300" width="140" height="60" rx="10" fill="#fafafa" stroke="#455a64" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="470" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Noise Source</text>
  <text x="470" y="345" text-anchor="middle" font-size="11" fill="#455a64">static · interference · errors</text>
  <line x1="470" y1="300" x2="470" y2="246" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- bottom caption -->
  <text x="100" y="330" text-anchor="middle" font-size="12" fill="#455a64">Uncertainty is</text>
  <text x="100" y="346" text-anchor="middle" font-size="12" fill="#455a64">measured in bits</text>
  <text x="825" y="330" text-anchor="middle" font-size="12" fill="#455a64">Redundancy lets the</text>
  <text x="825" y="346" text-anchor="middle" font-size="12" fill="#455a64">message survive noise</text>
</svg>
