<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>

  <!-- era boxes -->
  <g>
    <rect x="30" y="60" width="240" height="180" rx="14" fill="#f1f8e9" stroke="#7cb342" stroke-width="2.5"/>
    <text x="150" y="95" text-anchor="middle" font-size="20" font-weight="bold" fill="#33691e">Agrarian Society</text>
    <text x="150" y="120" text-anchor="middle" font-size="13" fill="#33691e">until ~1800</text>
    <text x="150" y="152" text-anchor="middle" font-size="14" fill="#263238">Key resource: land &amp; muscle</text>
    <text x="150" y="176" text-anchor="middle" font-size="14" fill="#263238">Workplace: the field</text>
    <text x="150" y="200" text-anchor="middle" font-size="14" fill="#263238">Wealth: acres &amp; harvests</text>
    <text x="150" y="224" text-anchor="middle" font-size="14" fill="#263238">Power: who holds territory</text>
  </g>
  <g>
    <rect x="330" y="60" width="240" height="180" rx="14" fill="#eceff1" stroke="#546e7a" stroke-width="2.5"/>
    <text x="450" y="95" text-anchor="middle" font-size="20" font-weight="bold" fill="#37474f">Industrial Society</text>
    <text x="450" y="120" text-anchor="middle" font-size="13" fill="#37474f">~1800–1970</text>
    <text x="450" y="152" text-anchor="middle" font-size="14" fill="#263238">Key resource: machines &amp; energy</text>
    <text x="450" y="176" text-anchor="middle" font-size="14" fill="#263238">Workplace: the factory</text>
    <text x="450" y="200" text-anchor="middle" font-size="14" fill="#263238">Wealth: capital &amp; production</text>
    <text x="450" y="224" text-anchor="middle" font-size="14" fill="#263238">Power: who owns industry</text>
  </g>
  <g>
    <rect x="630" y="60" width="240" height="180" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
    <text x="750" y="95" text-anchor="middle" font-size="20" font-weight="bold" fill="#00423b">Information Society</text>
    <text x="750" y="120" text-anchor="middle" font-size="13" fill="#00423b">~1970–present</text>
    <text x="750" y="152" text-anchor="middle" font-size="14" fill="#263238">Key resource: information</text>
    <text x="750" y="176" text-anchor="middle" font-size="14" fill="#263238">Workplace: the screen</text>
    <text x="750" y="200" text-anchor="middle" font-size="14" fill="#263238">Wealth: data, code &amp; attention</text>
    <text x="750" y="224" text-anchor="middle" font-size="14" fill="#263238">Power: who runs the networks</text>
  </g>

  <!-- arrows -->
  <line x1="272" y1="150" x2="326" y2="150" stroke="#455a64" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="572" y1="150" x2="626" y2="150" stroke="#455a64" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="299" y="135" text-anchor="middle" font-size="12" fill="#455a64">industrial</text>
  <text x="299" y="170" text-anchor="middle" font-size="12" fill="#455a64">revolution</text>
  <text x="599" y="135" text-anchor="middle" font-size="12" fill="#455a64">information</text>
  <text x="599" y="170" text-anchor="middle" font-size="12" fill="#455a64">revolution</text>

  <!-- caption strip -->
  <rect x="30" y="268" width="840" height="46" rx="10" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="450" y="296" text-anchor="middle" font-size="14" fill="#455a64">Each era layers on the last: we still farm and manufacture — information systems now coordinate both.</text>
</svg>
