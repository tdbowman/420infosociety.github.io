<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- heading for annotation column -->
  <text x="600" y="46" font-size="16" font-weight="bold" fill="#263238">EU AI Act risk tiers</text>
  <text x="600" y="64" font-size="12" fill="#455a64">Provisions phase in 2025&#8211;2027</text>

  <!-- pyramid layers (flat-topped, apex up) -->
  <!-- Tier 1: unacceptable risk -->
  <polygon points="260,48 340,48 392.5,128 207.5,128" fill="#00423b" stroke="#ffffff" stroke-width="3"/>
  <!-- Tier 2: high risk -->
  <polygon points="392.5,128 445,208 155,208 207.5,128" fill="#00897b" stroke="#ffffff" stroke-width="3"/>
  <!-- Tier 3: limited risk -->
  <polygon points="445,208 497.5,288 102.5,288 155,208" fill="#e0f2f1" stroke="#ffffff" stroke-width="3"/>
  <!-- Tier 4: minimal risk -->
  <polygon points="497.5,288 550,368 50,368 102.5,288" fill="#eceff1" stroke="#ffffff" stroke-width="3"/>

  <!-- labels inside layers -->
  <text x="300" y="86" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">UNACCEPTABLE</text>
  <text x="300" y="102" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RISK</text>
  <text x="300" y="174" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">HIGH RISK</text>
  <text x="300" y="254" font-size="14" font-weight="bold" fill="#00423b" text-anchor="middle">LIMITED RISK</text>
  <text x="300" y="334" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">MINIMAL RISK</text>

  <!-- connector lines from layers to annotations -->
  <line x1="380" y1="92" x2="590" y2="92" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="430" y1="172" x2="590" y2="172" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="482" y1="252" x2="590" y2="252" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="534" y1="332" x2="590" y2="332" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- annotations -->
  <text x="600" y="88" font-size="14" font-weight="bold" fill="#00423b">Banned outright</text>
  <text x="600" y="105" font-size="12" fill="#455a64">e.g., government social scoring of citizens</text>

  <text x="600" y="168" font-size="14" font-weight="bold" fill="#00423b">Strict obligations before use</text>
  <text x="600" y="185" font-size="12" fill="#455a64">e.g., CV-screening software for hiring</text>

  <text x="600" y="248" font-size="14" font-weight="bold" fill="#00423b">Transparency duties</text>
  <text x="600" y="265" font-size="12" fill="#455a64">e.g., chatbots must disclose they are AI</text>

  <text x="600" y="328" font-size="14" font-weight="bold" fill="#00423b">No new rules</text>
  <text x="600" y="345" font-size="12" fill="#455a64">e.g., spam filters, AI in video games</text>

  <!-- left-side axis arrow -->
  <line x1="30" y1="340" x2="30" y2="80" stroke="#455a64" stroke-width="2"/>
  <polygon points="30,68 24,82 36,82" fill="#455a64"/>
  <text x="18" y="210" font-size="12" fill="#455a64" text-anchor="middle" transform="rotate(-90 18 210)">fewer systems, stricter rules</text>
</svg>
