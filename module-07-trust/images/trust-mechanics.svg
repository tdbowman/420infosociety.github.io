<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">The Mechanics of Trust</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#455a64">Riegelsberger, Sasse &amp; McCarthy (2005): trust-warranting properties, and the signals that carry them</text>

  <!-- Trustor box (left) -->
  <rect x="30" y="120" width="180" height="170" rx="8" fill="#fafafa" stroke="#455a64" stroke-width="2"/>
  <text x="120" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#263238">TRUSTOR</text>
  <text x="120" y="168" text-anchor="middle" font-size="12" font-style="italic" fill="#455a64">the one who risks</text>
  <line x1="55" y1="180" x2="185" y2="180" stroke="#b0bec5" stroke-width="1"/>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#263238">buyer, guest, patient,</text>
  <text x="120" y="215" text-anchor="middle" font-size="11" fill="#263238">user of an AI system</text>
  <text x="120" y="238" text-anchor="middle" font-size="11" fill="#455a64">Reads the signals and</text>
  <text x="120" y="253" text-anchor="middle" font-size="11" fill="#455a64">decides whether to</text>
  <text x="120" y="268" text-anchor="middle" font-size="11" fill="#455a64">accept vulnerability</text>

  <!-- Trustee box (right) -->
  <rect x="690" y="120" width="180" height="170" rx="8" fill="#fafafa" stroke="#455a64" stroke-width="2"/>
  <text x="780" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#263238">TRUSTEE</text>
  <text x="780" y="168" text-anchor="middle" font-size="12" font-style="italic" fill="#455a64">the one relied upon</text>
  <line x1="715" y1="180" x2="845" y2="180" stroke="#b0bec5" stroke-width="1"/>
  <text x="780" y="200" text-anchor="middle" font-size="11" fill="#263238">seller, host, platform,</text>
  <text x="780" y="215" text-anchor="middle" font-size="11" fill="#263238">institution, AI system</text>
  <text x="780" y="238" text-anchor="middle" font-size="11" fill="#455a64">Its properties, real or</text>
  <text x="780" y="253" text-anchor="middle" font-size="11" fill="#455a64">faked, are what the</text>
  <text x="780" y="268" text-anchor="middle" font-size="11" fill="#455a64">signals advertise</text>

  <!-- Contextual properties box (top center) -->
  <rect x="250" y="76" width="400" height="106" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="450" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#00423b">CONTEXTUAL PROPERTIES — reasons to be trustworthy</text>
  <text x="450" y="118" text-anchor="middle" font-size="11" fill="#263238">Temporal embeddedness — we will deal with each other again</text>
  <text x="450" y="138" text-anchor="middle" font-size="11" fill="#263238">Social embeddedness — others will hear how this went</text>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="#263238">Institutional embeddedness — rules and sanctions stand behind us</text>

  <!-- Intrinsic properties box (bottom center) -->
  <rect x="250" y="306" width="400" height="86" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="450" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">INTRINSIC PROPERTIES — capacity to be trustworthy</text>
  <text x="450" y="348" text-anchor="middle" font-size="11" fill="#263238">Ability — can the trustee actually do what it promises?</text>
  <text x="450" y="368" text-anchor="middle" font-size="11" fill="#263238">Motivation / benevolence — does it want to do right by you?</text>

  <!-- Signals arrow: trustee -> trustor -->
  <line x1="690" y1="222" x2="228" y2="222" stroke="#00897b" stroke-width="3"/>
  <polygon points="228,215 214,222 228,229" fill="#00897b"/>
  <text x="450" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#00423b">SIGNALS: symbols &amp; symptoms of trustworthiness</text>

  <!-- Trusting action arrow: trustor -> trustee -->
  <line x1="210" y1="256" x2="672" y2="256" stroke="#455a64" stroke-width="3"/>
  <polygon points="672,249 686,256 672,263" fill="#455a64"/>
  <text x="450" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">TRUSTING ACTION: the trustor accepts vulnerability</text>

  <!-- Dashed connectors: properties feed the signals -->
  <line x1="330" y1="182" x2="330" y2="216" stroke="#00897b" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="324,214 330,224 336,214" fill="#00897b"/>
  <line x1="570" y1="306" x2="570" y2="232" stroke="#455a64" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="564,234 570,224 576,234" fill="#455a64"/>
  <text x="290" y="176" text-anchor="end" font-size="10" font-style="italic" fill="#00423b">carried by</text>
  <text x="610" y="300" text-anchor="start" font-size="10" font-style="italic" fill="#455a64">carried by</text>

  <!-- Bottom takeaway -->
  <text x="450" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#00423b">Trust is well placed when the signals the trustor reads truly track the trustee's properties — and misplaced when they can be faked.</text>
</svg>
