<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- title -->
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">One Capability, Two Modes of Use</text>

  <!-- top box: the same AI capability -->
  <rect x="315" y="52" width="270" height="52" rx="10" fill="#fafafa" stroke="#455a64" stroke-width="2"/>
  <text x="450" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">THE SAME AI SYSTEM</text>
  <text x="450" y="93" text-anchor="middle" font-size="12" fill="#455a64">drafts, summarizes, codes, answers</text>

  <!-- arrows to the two panels -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/>
    </marker>
  </defs>
  <line x1="360" y1="104" x2="240" y2="142" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="104" x2="660" y2="142" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- left panel: AUTOMATION -->
  <rect x="40" y="150" width="395" height="185" rx="12" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="237" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">AUTOMATION</text>
  <text x="237" y="202" text-anchor="middle" font-size="13" font-style="italic" fill="#455a64">The task is done instead of you</text>
  <line x1="70" y1="214" x2="405" y2="214" stroke="#455a64" stroke-width="1" opacity="0.4"/>
  <text x="62" y="240" font-size="13" fill="#263238">&#8226; Routine support replies sent with no human review</text>
  <text x="62" y="266" font-size="13" fill="#263238">&#8226; Standard translations published as-is</text>
  <text x="62" y="292" font-size="13" fill="#263238">&#8226; Forms and records processed end to end</text>
  <text x="62" y="318" font-size="13" fill="#263238">&#8226; Boilerplate code generated straight from a ticket</text>

  <!-- right panel: AUGMENTATION -->
  <rect x="465" y="150" width="395" height="185" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="662" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#00423b">AUGMENTATION</text>
  <text x="662" y="202" text-anchor="middle" font-size="13" font-style="italic" fill="#00897b">The task is done with you</text>
  <line x1="495" y1="214" x2="830" y2="214" stroke="#00897b" stroke-width="1" opacity="0.4"/>
  <text x="487" y="240" font-size="13" fill="#263238">&#8226; A nurse drafts chart summaries, verifies every one</text>
  <text x="487" y="266" font-size="13" fill="#263238">&#8226; A programmer iterates on model-drafted code</text>
  <text x="487" y="292" font-size="13" fill="#263238">&#8226; An analyst asks the model for counterarguments</text>
  <text x="487" y="318" font-size="13" fill="#263238">&#8226; A teacher tailors one lesson to thirty students</text>

  <!-- footer note -->
  <rect x="40" y="352" width="820" height="46" rx="10" fill="#fafafa" stroke="#00897b" stroke-width="1.5"/>
  <text x="450" y="371" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#00423b">Which mode you get is a deployment choice made by people and organizations &#8212;</text>
  <text x="450" y="389" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#00423b">not a property of the technology.</text>
</svg>
