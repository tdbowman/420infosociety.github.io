<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- title -->
  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">The AI Family Tree: Each Box Contains the Next</text>

  <!-- outer box: Artificial Intelligence -->
  <rect x="25" y="58" width="850" height="332" rx="10" fill="#fafafa" stroke="#455a64" stroke-width="2"/>
  <text x="450" y="84" text-anchor="middle" font-size="17" font-weight="bold" fill="#263238">ARTIFICIAL INTELLIGENCE</text>
  <text x="450" y="103" text-anchor="middle" font-size="12" fill="#455a64">Any technique that performs tasks we associate with intelligence</text>

  <!-- sibling branch: rule-based (symbolic) AI -->
  <rect x="50" y="122" width="235" height="243" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="167" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">RULE-BASED</text>
  <text x="167" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">(SYMBOLIC) AI</text>
  <text x="167" y="196" text-anchor="middle" font-size="12" fill="#455a64">Humans write explicit rules;</text>
  <text x="167" y="213" text-anchor="middle" font-size="12" fill="#455a64">the machine follows them</text>
  <text x="167" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#00423b">Examples</text>
  <text x="167" y="272" text-anchor="middle" font-size="12" fill="#455a64">Chess engines (Deep Blue)</text>
  <text x="167" y="290" text-anchor="middle" font-size="12" fill="#455a64">Tax preparation software</text>
  <text x="167" y="308" text-anchor="middle" font-size="12" fill="#455a64">Airline scheduling systems</text>

  <!-- sibling divider label -->
  <line x1="305" y1="200" x2="305" y2="290" stroke="#455a64" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="305" y="245" text-anchor="middle" font-size="10" fill="#455a64" transform="rotate(-90 301 245)">sibling branches</text>

  <!-- sibling branch: machine learning -->
  <rect x="325" y="122" width="525" height="243" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="587" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#00423b">MACHINE LEARNING</text>
  <text x="587" y="163" text-anchor="middle" font-size="11.5" fill="#455a64">Learns patterns from examples instead of following written rules</text>
  <text x="587" y="180" text-anchor="middle" font-size="11.5" fill="#455a64">Spam filters &#183; Recommendation systems</text>

  <!-- nested: deep learning -->
  <rect x="350" y="192" width="475" height="150" rx="8" fill="#fafafa" stroke="#00897b" stroke-width="1.5"/>
  <text x="587" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">DEEP LEARNING</text>
  <text x="587" y="228" text-anchor="middle" font-size="11" fill="#455a64">Many-layered neural networks trained on huge datasets</text>
  <text x="587" y="243" text-anchor="middle" font-size="11" fill="#455a64">Face recognition &#183; Speech-to-text</text>

  <!-- nested: generative AI / LLMs -->
  <rect x="375" y="253" width="425" height="77" rx="8" fill="#00897b" stroke="#00423b" stroke-width="1.5"/>
  <text x="587" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">GENERATIVE AI &#183; LARGE LANGUAGE MODELS</text>
  <text x="587" y="296" text-anchor="middle" font-size="11.5" fill="#ffffff">Produce new text, images, audio, and code</text>
  <text x="587" y="313" text-anchor="middle" font-size="11.5" fill="#e0f2f1">ChatGPT &#183; Claude &#183; Gemini &#183; Image generators</text>

  <!-- bottom caption -->
  <text x="450" y="410" text-anchor="middle" font-size="12" fill="#455a64">Moving inward: narrower in scope, newer in origin, hungrier for data and computing power</text>
</svg>
