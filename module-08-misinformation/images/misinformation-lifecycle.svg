<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#455a64"/>
    </marker>
    <marker id="arrowDark" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#00423b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- title -->
  <text x="22" y="30" font-size="17" font-weight="bold" fill="#263238">The Misinformation Lifecycle</text>

  <!-- recycle loop (over the top) -->
  <path d="M 802 68 L 802 48 L 98 48 L 98 62" fill="none" stroke="#00423b" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text x="480" y="42" font-size="11" fill="#00423b" text-anchor="middle" font-style="italic">narratives recycled into the next event</text>

  <!-- stage boxes -->
  <!-- 1. Creation -->
  <rect x="22" y="70" width="152" height="95" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="98" y="92" font-size="13.5" font-weight="bold" fill="#263238" text-anchor="middle">1. Creation</text>
  <text x="98" y="112" font-size="10.5" fill="#455a64" text-anchor="middle">organic error</text>
  <text x="98" y="127" font-size="10.5" fill="#455a64" text-anchor="middle">coordinated campaign</text>
  <text x="98" y="142" font-size="10.5" fill="#455a64" text-anchor="middle">AI generation</text>

  <!-- 2. Seeding -->
  <rect x="198" y="70" width="152" height="95" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="274" y="92" font-size="13.5" font-weight="bold" fill="#263238" text-anchor="middle">2. Seeding</text>
  <text x="274" y="112" font-size="10.5" fill="#455a64" text-anchor="middle">planted in receptive</text>
  <text x="274" y="127" font-size="10.5" fill="#455a64" text-anchor="middle">online communities</text>

  <!-- 3. Amplification (highlighted: the engine) -->
  <rect x="374" y="70" width="152" height="95" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="450" y="92" font-size="13.5" font-weight="bold" fill="#00423b" text-anchor="middle">3. Amplification</text>
  <text x="450" y="112" font-size="10.5" fill="#455a64" text-anchor="middle">algorithms</text>
  <text x="450" y="127" font-size="10.5" fill="#455a64" text-anchor="middle">+ emotions</text>
  <text x="450" y="142" font-size="10.5" fill="#455a64" text-anchor="middle">+ influencers</text>

  <!-- 4. Belief & Sharing -->
  <rect x="550" y="70" width="152" height="95" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="626" y="92" font-size="13.5" font-weight="bold" fill="#263238" text-anchor="middle">4. Belief &amp; Sharing</text>
  <text x="626" y="112" font-size="10.5" fill="#455a64" text-anchor="middle">repetition makes it</text>
  <text x="626" y="127" font-size="10.5" fill="#455a64" text-anchor="middle">feel familiar</text>

  <!-- 5. Correction Lag -->
  <rect x="726" y="70" width="152" height="95" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="802" y="92" font-size="13.5" font-weight="bold" fill="#263238" text-anchor="middle">5. Correction Lag</text>
  <text x="802" y="112" font-size="10.5" fill="#455a64" text-anchor="middle">fact-checks arrive late,</text>
  <text x="802" y="127" font-size="10.5" fill="#455a64" text-anchor="middle">reach fewer people</text>

  <!-- arrows between stages -->
  <line x1="176" y1="117" x2="194" y2="117" stroke="#455a64" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="352" y1="117" x2="370" y2="117" stroke="#455a64" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="528" y1="117" x2="546" y2="117" stroke="#455a64" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="704" y1="117" x2="722" y2="117" stroke="#455a64" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- intervention connectors (dashed) and anchor dots -->
  <line x1="129" y1="253" x2="362" y2="186" stroke="#00897b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="343" y1="253" x2="450" y2="186" stroke="#00897b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="557" y1="253" x2="626" y2="186" stroke="#00897b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="771" y1="253" x2="802" y2="186" stroke="#00897b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="362" cy="180" r="6" fill="#00897b"/>
  <circle cx="450" cy="180" r="6" fill="#00897b"/>
  <circle cx="626" cy="180" r="6" fill="#00897b"/>
  <circle cx="802" cy="180" r="6" fill="#00897b"/>

  <!-- intervention row label -->
  <text x="450" y="235" font-size="12" font-weight="bold" fill="#455a64" text-anchor="middle">WHERE THE COUNTERMEASURES INTERVENE</text>

  <!-- intervention boxes -->
  <rect x="34" y="255" width="190" height="80" rx="8" fill="#fafafa" stroke="#00897b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="129" y="278" font-size="13" font-weight="bold" fill="#00423b" text-anchor="middle">Prebunking</text>
  <text x="129" y="297" font-size="10.5" fill="#455a64" text-anchor="middle">inoculate against manipulation</text>
  <text x="129" y="312" font-size="10.5" fill="#455a64" text-anchor="middle">techniques before exposure</text>

  <rect x="248" y="255" width="190" height="80" rx="8" fill="#fafafa" stroke="#00897b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="343" y="278" font-size="13" font-weight="bold" fill="#00423b" text-anchor="middle">Labels &amp; friction</text>
  <text x="343" y="297" font-size="10.5" fill="#455a64" text-anchor="middle">warnings, context, and pauses</text>
  <text x="343" y="312" font-size="10.5" fill="#455a64" text-anchor="middle">that slow the sharing reflex</text>

  <rect x="462" y="255" width="190" height="80" rx="8" fill="#fafafa" stroke="#00897b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="557" y="278" font-size="13" font-weight="bold" fill="#00423b" text-anchor="middle">Media literacy</text>
  <text x="557" y="297" font-size="10.5" fill="#455a64" text-anchor="middle">durable habits: check sources,</text>
  <text x="557" y="312" font-size="10.5" fill="#455a64" text-anchor="middle">read laterally, calibrate trust</text>

  <rect x="676" y="255" width="190" height="80" rx="8" fill="#fafafa" stroke="#00897b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="771" y="278" font-size="13" font-weight="bold" fill="#00423b" text-anchor="middle">Community notes</text>
  <text x="771" y="297" font-size="10.5" fill="#455a64" text-anchor="middle">crowd-sourced corrections</text>
  <text x="771" y="312" font-size="10.5" fill="#455a64" text-anchor="middle">that shrink the lag</text>

  <!-- footnote -->
  <text x="450" y="368" font-size="10.5" fill="#455a64" text-anchor="middle" font-style="italic">The earlier in the loop an intervention acts, the better its odds — correction alone arrives after belief has formed.</text>
</svg>
