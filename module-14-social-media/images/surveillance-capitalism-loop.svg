<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00897b"/>
    </marker>
  </defs>

  <!-- center annotation -->
  <text x="450" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#00423b">The surveillance capitalism loop</text>
  <text x="450" y="218" text-anchor="middle" font-size="13" fill="#455a64">more use → more surplus → better prediction</text>
  <text x="450" y="236" text-anchor="middle" font-size="13" fill="#455a64">→ more revenue → stickier design → more use</text>

  <!-- arrows (clockwise) -->
  <path d="M 556 66 Q 630 76 662 102" fill="none" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 762 172 Q 790 210 762 256" fill="none" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 664 314 Q 630 344 576 356" fill="none" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 328 356 Q 260 344 220 316" fill="none" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 140 256 Q 112 210 140 172" fill="none" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 226 100 Q 270 74 342 64" fill="none" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 1. Free, engaging service (top) -->
  <rect x="348" y="38" width="204" height="48" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="450" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Free, engaging service</text>
  <text x="450" y="76" text-anchor="middle" font-size="12" fill="#455a64">feeds, likes, autoplay</text>

  <!-- 2. Behavioral data (upper right) -->
  <rect x="648" y="108" width="190" height="56" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
  <text x="743" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Behavioral data</text>
  <text x="743" y="150" text-anchor="middle" font-size="12" fill="#455a64">the &#8220;surplus&#8221;</text>

  <!-- 3. Prediction products (lower right) -->
  <rect x="648" y="260" width="190" height="48" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
  <text x="743" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Prediction products</text>
  <text x="743" y="298" text-anchor="middle" font-size="12" fill="#455a64">forecasts of what you'll do</text>

  <!-- 4. Targeted advertising / behavior modification (bottom) -->
  <rect x="332" y="340" width="236" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="450" y="363" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Targeted advertising</text>
  <text x="450" y="382" text-anchor="middle" font-size="12" fill="#455a64">&amp; behavior modification</text>

  <!-- 5. Revenue (lower left) -->
  <rect x="66" y="260" width="150" height="48" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="141" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Revenue</text>
  <text x="141" y="298" text-anchor="middle" font-size="12" fill="#455a64">ad auctions</text>

  <!-- 6. More engagement design (upper left) -->
  <rect x="56" y="108" width="200" height="56" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
  <text x="156" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">More engagement-</text>
  <text x="156" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">optimized design</text>
</svg>
