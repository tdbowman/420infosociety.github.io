<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00897b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">One vulnerability, four paths</text>

  <!-- Start box -->
  <rect x="20" y="172" width="150" height="66" rx="8" fill="#e0f2f1" stroke="#00423b" stroke-width="2"/>
  <text x="95" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Researcher finds</text>
  <text x="95" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">a vulnerability</text>

  <!-- Fan-out arrows -->
  <path d="M 170 205 L 208 205 L 208 82 L 244 82" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M 170 205 L 208 205 L 208 162 L 244 162" fill="none" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M 170 205 L 208 205 L 208 262 L 244 262" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M 170 205 L 208 205 L 208 342 L 244 342" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Path 1: Full public disclosure -->
  <rect x="248" y="57" width="180" height="50" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="338" y="79" text-anchor="middle" font-size="14" fill="#263238">Full public</text>
  <text x="338" y="97" text-anchor="middle" font-size="14" fill="#263238">disclosure</text>
  <text x="444" y="78" font-size="12.5" fill="#455a64">Forces the issue into the open — but arms</text>
  <text x="444" y="95" font-size="12.5" fill="#455a64">attackers before any patch exists</text>

  <!-- Path 2: Coordinated disclosure chain (teal) -->
  <rect x="248" y="137" width="190" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="343" y="159" text-anchor="middle" font-size="14" fill="#00423b">Coordinated disclosure</text>
  <text x="343" y="177" text-anchor="middle" font-size="14" fill="#00423b">to vendor</text>
  <path d="M 438 162 L 472 162" fill="none" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <rect x="476" y="137" width="170" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="561" y="159" text-anchor="middle" font-size="14" fill="#00423b">Patch developed</text>
  <text x="561" y="177" text-anchor="middle" font-size="14" fill="#00423b">and released</text>
  <path d="M 646 162 L 680 162" fill="none" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <rect x="684" y="137" width="150" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="759" y="167" text-anchor="middle" font-size="14" fill="#00423b">Publish findings</text>
  <text x="248" y="207" font-size="12.5" fill="#00423b">Protects users — but hinges on the vendor acting, and on how long the researcher must stay silent</text>

  <!-- Path 3: Sell -->
  <rect x="248" y="237" width="190" height="50" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="343" y="259" text-anchor="middle" font-size="14" fill="#263238">Sell to a broker</text>
  <text x="343" y="277" text-anchor="middle" font-size="14" fill="#263238">or government</text>
  <text x="454" y="258" font-size="12.5" fill="#455a64">Rewards the finder — the flaw stays secret,</text>
  <text x="454" y="275" font-size="12.5" fill="#455a64">possibly weaponized against others</text>

  <!-- Path 4: Do nothing -->
  <rect x="248" y="317" width="190" height="50" rx="8" fill="#fafafa" stroke="#455a64" stroke-width="1.5"/>
  <text x="343" y="347" text-anchor="middle" font-size="14" fill="#263238">Do nothing</text>
  <text x="454" y="338" font-size="12.5" fill="#455a64">No risk, no benefit — the flaw waits for</text>
  <text x="454" y="355" font-size="12.5" fill="#455a64">someone less scrupulous to find it</text>

  <text x="450" y="402" text-anchor="middle" font-size="12" font-style="italic" fill="#455a64">Every path is a decision about who gets protected, who gets paid, and who gets left exposed.</text>
</svg>
