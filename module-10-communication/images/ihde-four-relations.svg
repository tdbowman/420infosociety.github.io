<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Ihde's four human-technology relations shown as four labeled rows with schema notation and everyday examples">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#455a64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#00423b">Ihde&#8217;s Four Human&#8211;Technology Relations</text>

    <!-- Row 1: Embodiment -->
    <rect x="15" y="55" width="870" height="80" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <text x="30" y="88" font-size="15" font-weight="bold" fill="#00423b">Embodiment</text>
    <text x="30" y="106" font-size="11" fill="#455a64">glasses</text>
    <text x="186" y="97" font-size="22" fill="#00423b">(</text>
    <rect x="198" y="75" width="72" height="30" rx="5" fill="#e0f2f1" stroke="#00897b"/>
    <text x="234" y="95" text-anchor="middle" font-size="13" fill="#00423b">HUMAN</text>
    <text x="280" y="96" font-size="16" fill="#263238">&#8211;</text>
    <rect x="294" y="75" width="84" height="30" rx="5" fill="#eceff1" stroke="#455a64"/>
    <text x="336" y="95" text-anchor="middle" font-size="13" fill="#263238">GLASSES</text>
    <text x="382" y="97" font-size="22" fill="#00423b">)</text>
    <line x1="398" y1="90" x2="436" y2="90" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="444" y="75" width="72" height="30" rx="5" fill="#fafafa" stroke="#455a64"/>
    <text x="480" y="95" text-anchor="middle" font-size="13" fill="#263238">WORLD</text>
    <text x="560" y="85" font-size="12" font-style="italic" fill="#455a64">You look through your glasses at the world;</text>
    <text x="560" y="101" font-size="12" font-style="italic" fill="#455a64">the technology itself withdraws from notice.</text>

    <!-- Row 2: Hermeneutic -->
    <rect x="15" y="145" width="870" height="80" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <text x="30" y="178" font-size="15" font-weight="bold" fill="#00423b">Hermeneutic</text>
    <text x="30" y="196" font-size="11" fill="#455a64">thermometer</text>
    <rect x="185" y="165" width="72" height="30" rx="5" fill="#e0f2f1" stroke="#00897b"/>
    <text x="221" y="185" text-anchor="middle" font-size="13" fill="#00423b">HUMAN</text>
    <line x1="263" y1="180" x2="296" y2="180" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="302" y="187" font-size="22" fill="#00423b">(</text>
    <rect x="314" y="165" width="122" height="30" rx="5" fill="#eceff1" stroke="#455a64"/>
    <text x="375" y="185" text-anchor="middle" font-size="12" fill="#263238">THERMOMETER</text>
    <text x="441" y="186" font-size="16" fill="#263238">&#8211;</text>
    <rect x="454" y="165" width="72" height="30" rx="5" fill="#fafafa" stroke="#455a64"/>
    <text x="490" y="185" text-anchor="middle" font-size="13" fill="#263238">WORLD</text>
    <text x="530" y="187" font-size="22" fill="#00423b">)</text>
    <text x="580" y="175" font-size="12" font-style="italic" fill="#455a64">You read a number on the display and</text>
    <text x="580" y="191" font-size="12" font-style="italic" fill="#455a64">take it as the temperature of the world.</text>

    <!-- Row 3: Alterity -->
    <rect x="15" y="235" width="870" height="80" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <text x="30" y="268" font-size="15" font-weight="bold" fill="#00423b">Alterity</text>
    <text x="30" y="286" font-size="11" fill="#455a64">chatbot</text>
    <rect x="185" y="255" width="72" height="30" rx="5" fill="#e0f2f1" stroke="#00897b"/>
    <text x="221" y="275" text-anchor="middle" font-size="13" fill="#00423b">HUMAN</text>
    <line x1="263" y1="270" x2="296" y2="270" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="304" y="255" width="90" height="30" rx="5" fill="#e0f2f1" stroke="#00897b"/>
    <text x="349" y="275" text-anchor="middle" font-size="13" fill="#00423b">CHATBOT</text>
    <text x="408" y="277" font-size="22" fill="#90a4ae">(</text>
    <rect x="420" y="255" width="72" height="30" rx="5" fill="#ffffff" stroke="#b0bec5" stroke-dasharray="5,4"/>
    <text x="456" y="275" text-anchor="middle" font-size="13" fill="#90a4ae">WORLD</text>
    <text x="498" y="277" font-size="22" fill="#90a4ae">)</text>
    <text x="560" y="265" font-size="12" font-style="italic" fill="#455a64">You address the technology itself, as a</text>
    <text x="560" y="281" font-size="12" font-style="italic" fill="#455a64">quasi-other; the world recedes behind it.</text>

    <!-- Row 4: Background -->
    <rect x="15" y="325" width="870" height="80" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <text x="30" y="358" font-size="15" font-weight="bold" fill="#00423b">Background</text>
    <text x="30" y="376" font-size="11" fill="#455a64">thermostat</text>
    <rect x="185" y="345" width="72" height="30" rx="5" fill="#e0f2f1" stroke="#00897b"/>
    <text x="221" y="365" text-anchor="middle" font-size="13" fill="#00423b">HUMAN</text>
    <line x1="263" y1="360" x2="296" y2="360" stroke="#455a64" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="302" y="367" font-size="22" fill="#00423b">(</text>
    <rect x="314" y="345" width="110" height="30" rx="5" fill="#eceff1" stroke="#455a64"/>
    <text x="369" y="365" text-anchor="middle" font-size="12" fill="#263238">THERMOSTAT</text>
    <text x="430" y="366" font-size="16" fill="#263238">/</text>
    <rect x="442" y="345" width="72" height="30" rx="5" fill="#fafafa" stroke="#455a64"/>
    <text x="478" y="365" text-anchor="middle" font-size="13" fill="#263238">WORLD</text>
    <text x="518" y="367" font-size="22" fill="#00423b">)</text>
    <text x="570" y="355" font-size="12" font-style="italic" fill="#455a64">The thermostat shapes the room from the</text>
    <text x="570" y="371" font-size="12" font-style="italic" fill="#455a64">fringe of awareness &#8212; felt, never attended to.</text>
  </g>
</svg>
