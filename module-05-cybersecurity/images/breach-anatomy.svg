<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">Anatomy of the Change Healthcare Breach (February 2024)</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#455a64">ALPHV/BlackCat ransomware-as-a-service · data of roughly a third of Americans implicated</text>

  <!-- arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/>
    </marker>
  </defs>

  <!-- TOP ROW: stages 1-4, y=90..170 -->
  <!-- 1. Stolen credentials -->
  <rect x="20" y="90" width="190" height="80" rx="10" fill="#fafafa" stroke="#00423b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="115" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Stolen credentials</text>
  <text x="115" y="137" text-anchor="middle" font-size="11" fill="#455a64">remote-access portal</text>
  <text x="115" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#455a64">no MFA</text>

  <!-- 2. Intrusion -->
  <rect x="243" y="90" width="190" height="80" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="338" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Intrusion</text>
  <text x="338" y="143" text-anchor="middle" font-size="11" fill="#455a64">attackers inside the network</text>

  <!-- 3. Ransomware deployed -->
  <rect x="466" y="90" width="190" height="80" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="561" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Ransomware</text>
  <text x="561" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">deployed</text>
  <text x="561" y="154" text-anchor="middle" font-size="11" fill="#455a64">systems encrypted</text>

  <!-- 4. Nationwide outage -->
  <rect x="689" y="90" width="190" height="80" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="784" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">Nationwide outage</text>
  <text x="784" y="137" text-anchor="middle" font-size="11" fill="#455a64">claims &amp; billing halt at</text>
  <text x="784" y="152" text-anchor="middle" font-size="11" fill="#455a64">pharmacies &amp; providers</text>

  <!-- top row arrows -->
  <line x1="210" y1="130" x2="237" y2="130" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="433" y1="130" x2="460" y2="130" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="656" y1="130" x2="683" y2="130" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- down arrow from stage 4 to stage 5 -->
  <line x1="784" y1="170" x2="784" y2="224" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- BOTTOM ROW: stages 5-7 (right to left), y=230..310 -->
  <!-- 5. Ransom paid -->
  <rect x="689" y="230" width="190" height="80" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="784" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">~$22M ransom paid</text>
  <text x="784" y="283" text-anchor="middle" font-size="11" fill="#455a64">to restore systems</text>

  <!-- 6. Exit scam -->
  <rect x="354" y="230" width="190" height="80" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="449" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Exit scam</text>
  <text x="449" y="277" text-anchor="middle" font-size="11" fill="#455a64">ALPHV keeps the money,</text>
  <text x="449" y="292" text-anchor="middle" font-size="11" fill="#455a64">cuts out its affiliate</text>

  <!-- 7. Second extortion -->
  <rect x="20" y="230" width="190" height="80" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="115" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Second extortion</text>
  <text x="115" y="277" text-anchor="middle" font-size="11" fill="#455a64">affiliate still holds</text>
  <text x="115" y="292" text-anchor="middle" font-size="11" fill="#455a64">the stolen data</text>

  <!-- bottom row arrows (right to left) -->
  <line x1="689" y1="270" x2="550" y2="270" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="354" y1="270" x2="216" y2="270" stroke="#455a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- bottom takeaway -->
  <rect x="180" y="342" width="540" height="52" rx="8" fill="#fafafa" stroke="#00423b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#00423b">One missing safeguard sat at the head of the chain</text>
  <text x="450" y="383" text-anchor="middle" font-size="12" fill="#455a64">Breaking any single link — MFA, detection, decentralization — breaks the cascade</text>
</svg>
